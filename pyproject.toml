[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apoe-genotyping-toolkit"
version = "2.0.0"
description = "Call APOE genotypes from rs429358 and rs7412, count eligible participants and build stratified recall lists."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Ugur Tuna"},
]
keywords = ["apoe", "genotyping", "bioinformatics", "genomics", "alzheimers"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff==0.16.9",
    "mypy>=1.11",
    "pandas-stubs",
]

[project.scripts]
apoe-toolkit = "apoe_toolkit.cli:main"

[project.urls]
Homepage = "https://github.com/dsugurtuna/apoe-genotyping-toolkit"
Repository = "https://github.com/dsugurtuna/apoe-genotyping-toolkit"
Issues = "https://github.com/dsugurtuna/apoe-genotyping-toolkit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88
# legacy/ holds the original scripts, kept as published for reference.
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
